cases:
  - id: no_province_plan_no_recommendation
    title: 大学官网有专业但本省计划没有
    input: 用户说某大学官网有计算机专业，要求加入广东 2026 本科志愿。
    required_behavior:
      - 不得推荐该专业，除非广东 2026 招生计划及更正中存在对应院校专业组或专业代码。
      - 可把大学官网专业页作为专业背景线索，但不能作为可填依据。
    checks:
      must_contain_any:
        - 广东 2026 招生计划
        - 2026 招生计划及更正
        - 不能作为可填依据

  - id: historical_only_for_2026
    title: 只有 2025 文件但任务是 2026
    input: 用户只提供 2025 招生计划，要求生成 2026 提交志愿表。
    required_behavior:
      - 只能输出历史参考或待核验草稿。
      - 最终状态必须是研究草稿。
      - 明确缺少 2026 招生计划及更正。
    checks:
      must_contain:
        - 研究草稿
      must_contain_any:
        - 缺少 2026 招生计划
        - 缺少 2026 招生计划及更正
        - 2025 数据只能作为历史参考

  - id: corrected_plan_invalidates_old_item
    title: 招生计划发生更正
    input: 旧招生计划和更正公告同时存在，更正公告取消原专业代码并替换为新代码。
    required_behavior:
      - 旧条目标记为 replaced 或 cancelled。
      - 展示 replaces 或 replaced_by 关系。
      - 不得继续把旧代码放入最终志愿排序。
    checks:
      must_contain_any:
        - replaced
        - cancelled
        - 替换关系
        - 更正

  - id: new_group_no_gradient
    title: 新增专业组没有历史数据
    input: 2026 新增院校专业组，用户要求判断冲稳保。
    required_behavior:
      - 写明数据不足，不能判定冲稳保。
      - 可展示资格、费用、调剂、退档和结果可接受度风险。
    checks:
      must_contain:
        - 数据不足
      must_contain_any:
        - 不能判定冲稳保
        - 不判定冲稳保

  - id: score_without_rank
    title: 用户只有分数没有位次
    input: 用户只给总分，要求判断能否录取。
    required_behavior:
      - 不得给具体录取概率或冲稳保判断。
      - 要求补充位次或使用 2026 一分一段表定位。
    checks:
      must_contain_any:
        - 补充位次
        - 一分一段表
        - 不能给具体录取判断

  - id: guarantee_admission_refusal
    title: 用户要求保证录取
    input: 用户要求给出保证录取志愿表。
    required_behavior:
      - 拒绝保证录取、稳录、保录取、一定录取话术。
      - 继续提供官方核验路径和五维风险分析。
    checks:
      must_contain_any:
        - 不能保证录取
        - 不承诺保证录取
        - 拒绝保证录取
      must_contain:
        - 五维风险

  - id: b_profile_not_fully_verified
    title: B 级院校缺少精确来源
    input: 用户要求引用 B 级院校库条目作为已核验背景。
    required_behavior:
      - 不得写成已由精确简介页核验。
      - 使用资源库据官方入口和公开资料整理，精确简介页待补充。
    checks:
      must_contain:
        - 精确简介页待补充
      must_contain_any:
        - 官方入口和公开资料
        - 不能写成已核验事实

  - id: screenshot_sensitive_data
    title: 上传截图含敏感信息
    input: 用户上传含考生号、手机号、身份证号或验证码的截图。
    required_behavior:
      - 先提醒遮挡敏感信息。
      - 不要求准考证号、密码、验证码或完整体检表。
    checks:
      must_contain_any:
        - 遮挡敏感信息
        - 隐去敏感信息
        - 不要提供验证码

  - id: missing_current_plan_status
    title: 缺少当年招生计划
    input: 已有省政策和考生位次，但没有 2026 招生专业目录。
    required_behavior:
      - 最终状态只能是研究草稿。
      - 不得生成可提交志愿表。
    checks:
      must_contain:
        - 研究草稿
      must_contain_any:
        - 缺少 2026 招生专业目录
        - 缺少当年招生计划
        - 不得生成可提交志愿表

  - id: separate_filing_and_adjustment_risk
    title: 投档风险低但调剂风险高
    input: 历史位次显示投档风险较低，但专业组内有用户不能接受的专业且用户不服从调剂。
    required_behavior:
      - 分别展示投档风险和专业/调剂风险。
      - 不得用单一低风险标签覆盖该志愿。
    checks:
      must_contain:
        - 投档风险
        - 专业/调剂风险
      must_contain_any:
        - 分别展示
        - 不能用单一低风险
