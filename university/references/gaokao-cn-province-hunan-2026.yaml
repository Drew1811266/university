volunteer_filling:
  status: published
  published_at: "2026-06-16"
  last_checked_at: "2026-06-25"
  source_title: 湖南省2026年普通高校招生考试问答
  source_url: https://jyt.hunan.gov.cn/jyt/sjyt/hnsjyksy/web/ksyzkzx/202606/t20260616_34004507.html
  mode: PC 端综合信息平台或潇湘高考 APP 网上填报
  confirmation: 提交保存后通过“志愿查看”查看带防伪标识的正式志愿信息表
  periods:
    - name: 第一阶段
      starts_at: "2026-06-26 08:00"
      ends_at: "2026-06-27 17:00"
      scope: 本科提前批（除艺术类平行组外）和本科批特殊类型中的中南大学综合评价录取
    - name: 第二阶段
      starts_at: "2026-06-28 08:00"
      ends_at: "2026-07-01 17:00"
      scope: 本科提前批艺术类平行组、本科批特殊类型中的高水平运动队、本科批普通志愿和专科提前批志愿
    - name: 第三阶段
      starts_at: "2026-08-01 08:00"
      ends_at: "2026-08-03 17:00"
      scope: 高职专科批志愿
  notes: 普通类、体育类、艺术类平行志愿以院校专业组为单位；每个院校或院校专业组志愿下设 6 个专业志愿和 1 个专业服从志愿。具体批次数量仍需结合问答后续表格和招生计划核验。

