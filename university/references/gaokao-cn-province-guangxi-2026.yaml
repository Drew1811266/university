volunteer_filling:
  status: published
  published_at: "2026-06-17"
  last_checked_at: "2026-06-25"
  source_title: 自治区招生考试院关于做好我区2026年普通高校招生统一考试志愿填报工作的通知
  source_url: https://www.gxeea.cn/view/content_619_32854.htm
  mode: 网上填报，分电脑端和手机端；电脑端唯一网站为广西招生考试院网站，手机端唯一App为“八桂高考”App。
  confirmation: 志愿一经锁定或志愿填报时间截止，考生本人及任何其他单位或个人均不能更改、补填。
  periods:
    - name: 本科提前批和高职高专提前批
      starts_at: "2026-06-25 15:00"
      ends_at: "2026-06-29 10:00"
      scope: 本科提前批、高职高专提前批
    - name: 其他批次
      starts_at: "2026-06-29 15:00"
      ends_at: "2026-07-03 10:00"
      scope: 其他批次
  notes: 系统每天23:00至次日6:00为维护时间；征集志愿时间以广西招生考试院网站后续公告为准。

