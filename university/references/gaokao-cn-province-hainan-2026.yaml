volunteer_filling:
  status: published
  published_at: "2026-05-28"
  last_checked_at: "2026-06-25"
  source_title: "2026年海南省普通高校招生实施办法"
  source_url: "https://ea.hainan.gov.cn/ywdt/ptgkyjszsb/202605/t20260528_4083583.html"
  mode: 院校专业组为志愿填报与投档录取基本单位；本科普通批等实行院校专业组志愿，每个院校专业组内设 6 个专业志愿和服从专业调剂志愿。
  confirmation: "政策问答要求考生在规定时段内可修改、保存志愿；调整完成后必须点击确认提交，提交成功才算志愿填报完成，以最后提交志愿为确认志愿。"
  periods:
    - batch: 本科提前部分艺术校考及戏曲类省际联考、军队公安司法消防救援等须提前填报批次、须面试的高职专科提前批
      start: "2026-06-27 08:00"
      end: "2026-06-27 17:30"
      notes: 实施办法附件列示；不同类型录取时间不同，提交前须以省考试局最新公告核验。
    - batch: 本科艺术类统考、本科体育类、国家专项计划、高校专项计划、地方专项计划、高水平运动队、拔尖创新人才班等、本科普通部分
      start: "2026-07-02 08:00"
      end: "2026-07-05 17:30"
      notes: 本科普通部分含本科普通批、本科少数民族班、本科预科班。
    - batch: 高职（专科）提前批（提前普通类、艺术类、体育类）及高职（专科）批（普通类）
      start: "2026-07-30 08:00"
      end: "2026-08-01 17:30"
      notes: 高职（专科）批普通类录取时间为 2026-08-09 至 2026-08-15；预计征集志愿时间以省考试局公告为准。
  notes: 本科提前普通类设 6 个院校专业组志愿；本科艺术统考、本科体育、国家专项、高校专项、地方专项各设 10 个院校专业组志愿；本科普通批（含本科少数民族班）设 30 个院校专业组志愿，本科预科班设 6 个院校专业组志愿；高职专科相关批次按实施办法列示数量执行。系统入口只从海南省考试局官网进入。

