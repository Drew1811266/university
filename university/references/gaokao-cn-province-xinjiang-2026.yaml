  source_url: https://www.xjzk.gov.cn/c/2026-06-22/495343.shtml
  notes: 官方要求考生登录系统后查阅《2026年普通高等学校在疆招生计划专业目录》，并以该目录中的院校招生代号、专业代号、专业名称和相关要求填报；生成候选池仍需读取具体目录条目和后续更正。

