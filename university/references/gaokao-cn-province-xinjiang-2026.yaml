volunteer_filling:
  status: published
  published_at: "2026-06-22"
  last_checked_at: "2026-06-25"
  source_title: 新疆2026年普通高考志愿填报系统拟于6月25日上午12时正式开通
  source_url: https://www.xjzk.gov.cn/c/2026-06-22/495343.shtml
  mode: 网上填报，考生通过新疆教育考试院官方网站“公众服务大厅”中的“志愿填报”进入“新疆普通高考志愿填报”系统。
  confirmation: 填报前须严格按照《2026年普通高等学校在疆招生计划专业目录》公布的院校招生代号、院校名称、招生批次、科类、招生专业代号、专业名称和相关要求填报并确认，内容应准确无误。
  periods:
    - name: 本科提前批次
      starts_at: "2026-06-25 12:00"
      ends_at: "2026-07-01 12:00"
      scope: 本科提前批次
    - name: 其他批次
      starts_at: "2026-06-25 12:00"
      ends_at: "2026-07-03 12:00"
      scope: 其他批次
  notes: 志愿填报期间每日2:00至8:00为系统运维时间；录取期间从本科一批次征集志愿时起，考生可在征集志愿时间填报并修改后续批次志愿。

