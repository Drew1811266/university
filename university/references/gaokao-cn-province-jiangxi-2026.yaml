volunteer_filling:
  status: published
  published_at: "2026-06-11"
  last_checked_at: "2026-06-26"
  source_title: "2026年普通高考志愿填报及投档规则"
  source_url: "http://www.jxeea.cn/jxsjyksy/gsgg91/content/content_2065234835032301568.html"
  mode: 2个阶段集中填报志愿和每批次录取后缺额征集；院校专业组为主要志愿单位，所有批次的院校专业组志愿内均设6个专业志愿及是否服从专业调剂志愿。
  confirmation: 集中填报志愿期间，考生可对已提交当次志愿修改2次；征集志愿提交后不能修改。
  periods:
    - name: 第一次集中填报
      starts_at: "2026-06-26 09:00"
      ends_at: "2026-06-27 17:00"
      scope: 提前本科军、警类志愿栏志愿（单志愿及平行志愿）
    - name: 第二次集中填报
      starts_at: "2026-06-30 09:00"
      ends_at: "2026-07-04 17:00"
      scope: 除提前本科军、警类志愿栏以外的其他志愿
  notes: 本科批平行志愿栏设45个院校专业组，征集志愿设20个院校专业组；高职（专科）批平行志愿栏设45个院校专业组并安排2次征集。具体特殊类型仍需按原文逐项核对。

