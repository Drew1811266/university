volunteer_filling:
  status: published
  published_at: "2026-06-18"
  last_checked_at: "2026-06-25"
  source_title: "辽宁省2026年普通高校招生志愿填报及招生录取问答"
  source_url: "https://www.lnzsks.com/newsinfo/IMS_20260618_46087_Spwxl9yv2o.htm"
  mode: 普通类历史学科类、物理学科类分列招生计划，部分提前批采用有序院校志愿，本科提前批 B 段、本科批、高职（专科）批等主要批次采用“专业+学校”为单位的平行志愿；“专业+学校”模式取消专业服从调剂，但仍存在体检、语种、单科、章程限制等退档风险。
  confirmation: 志愿网报系统于 2026-06-19 开放，成绩发布后正式填报、调整和确认；正式填报截止时间为 2026-06-30 16:00。志愿必须在“志愿填报”中保存并最终确认，“关注”预选志愿不具备正式志愿效力。最终确认后原则上不能修改；如确需取消最终确认，须在 2026-06-29 17:00 前持身份证等材料到报名所在地县（市、区）招考办申请。
  periods:
    - name: 2026 年普通高考志愿正式填报、调整和确认
      starts_at: "2026-06-24 16:00"
      ends_at: "2026-06-30 16:00"
      scope: 普通类、艺术类、体育类各批次志愿；具体批次、征集志愿和资格要求按问答及后续公告执行
  notes: 普通类本科提前批 A 段、高职（专科）提前批实行有序志愿，设置 2 个院校志愿，每个院校 4 个专业志愿和专业服从志愿；普通类本科提前批 B 段、高职（专科）批设置 60 个“专业+学校”平行志愿，本科批设置 112 个“专业+学校”平行志愿。艺术类本科提前批设置 1 个院校志愿和 4 个专业志愿且必须无条件服从专业安排；艺术类本科批 60 个“专业（含科类及方向）+学校”平行志愿，高职专科批 30 个；体育类本科批 50 个“专业+学校”平行志愿，高职专科批 30 个。征集志愿批次和次数须按官方问答及后续公告核验。

