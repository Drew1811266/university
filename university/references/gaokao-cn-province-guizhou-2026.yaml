  periods:
    - name: 本科和高职（专科）各批次志愿填报
      starts_at: "2026-06-28 00:00"
      ends_at: "2026-07-02 18:00"
      scope: 通过贵州省普通高校招生考试考生综合信息平台填报本科和高职（专科）各批次志愿
  notes: 普通类本科批设置96个专业（类）平行志愿，高职（专科）批设置96个专业（类）平行志愿；提前批不同段设置院校顺序志愿或60个专业（类）平行志愿。平行志愿原则上不设服从专业调剂，院校顺序志愿以“1个院校+6个专业（类）”为1个志愿并设置是否服从专业调剂。

