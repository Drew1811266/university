volunteer_filling:
  status: published
  published_at: "2026-06-24"
  last_checked_at: "2026-06-26"
  source_title: 青海省2026年普通高考成绩发布公告
  source_url: https://www.qhjyks.com/zyym/ztzl/ptgkz/5821.htm
  mode: 网上集中填报志愿；除按教育部及招生院校核定拟录取名单投档录取以及需填报纸质志愿的考生外，其余考生一次性填报符合条件的所有批次（段）志愿。
  confirmation: 志愿填报系统将在截止时间自动关闭，逾期不再受理补报及志愿修改；用户须自行保管考生号、身份证号、手机号、登录密码、短信验证码和志愿提交码。
  periods:
    - name: 首次网上集中填报志愿
      starts_at: "2026-06-26 12:00"
      ends_at: "2026-06-30 18:00"
      scope: 符合条件的所有批次（段）志愿
  notes: 录取工作实施细则明确2026年共设置四个批次、十个段，本科批⑦段和高职（专科）批⑩段均填报96个专业（类）平行志愿；不同提前批段分别设置2个院校顺序志愿或60个专业（类）平行志愿。

