  source_title: 吉林省2026年普通高考志愿填报核心要点问答集锦
  source_url: https://www.jleea.com.cn/site1/xiangqingye/202714/
  mode: 网上填报
  confirmation: 考生需登录吉林省普通高考考生服务平台，按要求准确录入院校专业组代码、专业代码，并确认是否服从调剂；正式确认细则和截止时间需核验填报通知。
  periods: []
  notes: 普通类提前批A、B段为顺序志愿且各设1个院校专业组志愿；普通类本科批设50个院校专业组平行志愿，专科批设40个院校专业组平行志愿。艺术类提前批A段设1个院校专业组志愿，本科批和专科批各设20个平行志愿；体育类本科批和专科批各设20个院校专业组平行志愿。填报时间表仍需核验正式通知。

