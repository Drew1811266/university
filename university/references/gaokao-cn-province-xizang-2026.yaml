  source_url: "http://zsks.edu.xizang.gov.cn/71/74/7863.html"
  notes: 成绩公布后，考生如对本人成绩有异议，可申请复核；复核申请提交截止时间为 2026-06-28 18:30 前，逾期不予办理。考生须携带本人居民身份证和准考证原件，到报名所在地教育考试机构填写《2026年西藏自治区普通高考成绩复查申请表》一次性提出复核申请。复核内容包括个人相关信息、是否本人答题卡、是否漏评、小题得分是否漏统（登）、各小题得分合成后是否与提供给考生的成绩一致等，不涉及评分标准和评分细则掌握宽严问题。

