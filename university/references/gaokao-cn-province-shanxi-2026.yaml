volunteer_filling:
  status: published
  published_at: "2026-06-22"
  last_checked_at: "2026-06-25"
  source_title: "山西省2026年普通高校招生网上填报志愿时间安排公告"
  source_url: "http://www.sxkszx.cn/news/2026622/n1891127206.html"
  mode: 山西 2026 普通高校招生采用“3+1+2”模式，录取分本科、专科（高职）两个阶段，按类别分批次进行，采用院校专业组方式设置志愿；考生选考科目须符合所报院校专业组要求。普通类本科提前批 A/C 段和普通专科提前批等实行非平行志愿，普通本科提前批 B 段、普通本科批平行志愿栏、普通专科（高职）批，以及艺术本科批、艺术专科批、体育本科/专科批等实行平行志愿。
  confirmation: 考生必须登录“山西招生考试网”，通过“考生登录”进入“2026年普通高考考生网上服务平台”填报；志愿信息填报确认提交后，在本阶段网上填报志愿结束前要重新登录系统回看并检查，若有错误需修改后重新提交。志愿填报确认后任何人不得改动。官方提醒不要通过搜索引擎误入非官网系统。
  periods:
    - name: 第一段志愿填报
      starts_at: "2026-06-27 08:00"
      ends_at: "2026-06-28 18:00"
      scope: 艺术本科提前批、普通本科提前批（A、B、C段）
    - name: 第二段志愿填报
      starts_at: "2026-07-02 08:00"
      ends_at: "2026-07-07 18:00"
      scope: 艺术本科批、体育本科批、普通本科批
    - name: 第三段志愿填报
      starts_at: "2026-07-18 08:00"
      ends_at: "2026-07-19 18:00"
      scope: 艺术专科（高职）提前批、普通专科（高职）提前批
    - name: 第四段志愿填报
      starts_at: "2026-07-25 08:00"
      ends_at: "2026-07-26 18:00"
      scope: 艺术专科（高职）批、体育专科（高职）批、普通专科（高职）批
  notes: 山西 2026 招生工作规定明确，普通本科提前批 A 段 3 个院校专业组志愿、每组 6 个专业及是否服从调剂；B 段 45 个院校专业组平行志愿、每组 6 个专业及是否服从调剂；C 段 3 个院校专业组志愿、每组 6 个专业及是否服从调剂。普通本科批高水平运动队单志愿栏 1 个院校专业组，预科班单志愿栏调整为 7 个并采取平行志愿录取，平行志愿栏 45 个院校专业组、每组 6 个专业及是否服从调剂。普通专科提前批 3 个院校专业组志愿，普通专科批 45 个院校专业组平行志愿；艺术、体育各批次志愿数量和规则须按招生工作规定原文核验。

