volunteer_filling:
  status: published
  published_at: "2026-06-17"
  last_checked_at: "2026-06-25"
  source_title: "2026年河北省普通高考志愿填报须知"
  source_url: "https://www.hebeea.edu.cn/c/2026-06-17/493051.html"
  mode: 普通类本科提前批B段、本科批、专科批等实行“专业（类）+学校”为单位的平行志愿；部分提前批、艺术校考/戏曲类等实行以学校为单位的顺序志愿。具体批次、计划性质、科类和资格要求必须按 2026 志愿填报须知及招生计划逐项核验。
  confirmation: 考生远程网上填报；每个批次（段）须点击“保存并提交”，未保存提交的志愿无效；截止前可多次修改，最终以最后一次保存并提交成功的志愿为准。填报系统是唯一正式途径，智能参考系统不能代替正式填报。
  periods:
    - name: 本科提前批A段军队院校志愿、专科提前批定向培养军士院校志愿集中填报
      starts_at: "2026-06-26 10:00"
      ends_at: "2026-06-27 10:00"
      scope: 本科提前批A段军队院校志愿、专科提前批定向培养军士院校志愿
    - name: 本科提前批（除A段军队院校志愿）、本科批、对口本科批集中填报
      starts_at: "2026-06-28 09:00"
      ends_at: "2026-07-02 17:00"
      scope: 本科提前批A/B/C段（A段军队院校志愿除外）、本科批、对口本科批
    - name: 专科提前批（除定向培养军士院校志愿）、专科批、对口专科批集中填报
      starts_at: "2026-07-29 12:00"
      ends_at: "2026-08-01 17:00"
      scope: 专科提前批、专科批、对口专科批
    - name: 本科提前批A段志愿征集
      starts_at: "2026-07-11 17:00"
      ends_at: "2026-07-12 10:00"
      scope: 本科提前批A段
    - name: 本科提前批B段、对口本科批志愿征集
      starts_at: "2026-07-16 12:00"
      ends_at: "2026-07-17 10:00"
      scope: 本科提前批B段、对口本科批
    - name: 本科批第一次志愿征集
      starts_at: "2026-07-24 12:00"
      ends_at: "2026-07-26 17:00"
      scope: 本科批
    - name: 本科批第二次志愿征集
      starts_at: "2026-07-29 12:00"
      ends_at: "2026-08-01 17:00"
      scope: 本科批
    - name: 专科提前批、对口专科批志愿征集
      starts_at: "2026-08-07 18:00"
      ends_at: "2026-08-08 17:00"
      scope: 专科提前批、对口专科批
    - name: 专科批第一次志愿征集
      starts_at: "2026-08-13 12:00"
      ends_at: "2026-08-14 10:00"
      scope: 专科批
    - name: 专科批第二次志愿征集
      starts_at: "2026-08-15 18:00"
      ends_at: "2026-08-16 17:00"
      scope: 专科批
    - name: 专科批第三次志愿征集
      starts_at: "2026-08-18 12:00"
      ends_at: "2026-08-19 10:00"
      scope: 专科批
  notes: 志愿填报期间每日 0:00 至 6:00 为系统维护时间。普通类本科提前批B段、本科批、专科批每次最多可填报 96 个“专业（类）+学校”志愿；本科提前批A段/专科提前批特殊要求专业以学校为单位，每次可填 1 所学校、6 个专业志愿和 1 个专业服从调剂选项；艺术/体育/对口规则需按考生类别读取须知原文。

