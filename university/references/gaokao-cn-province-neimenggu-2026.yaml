volunteer_filling:
  status: published
  published_at: "2026-06-04"
  last_checked_at: "2026-06-25"
  source_title: "内蒙古自治区2026年普通高校招生网上填报志愿和投档录取等有关工作的安排"
  source_url: "https://www.nm.zsks.cn/kszs/ptgk/zcfg/202606/t20260604_46401.html"
  mode: 本科提前批 A 段实行顺序志愿，其他批次/段主要实行“院校专业组”平行志愿；平行志愿每批最多填报 60 个院校专业组志愿，每个院校专业组最多填 12 个专业志愿和是否服从专业调剂。
  confirmation: 考生须在填报截止前点击“确认志愿”；确认后不能修改。每次填报有两次取消确认机会，取消后可修改并重新确认。若截止时已保存但未确认，系统默认确认，效力与本人确认相同。所有后续公告、实时统计和计划调整以“2026高考网上填报志愿专栏”和志愿系统为准。
  periods:
    - name: 提前批意向类别志愿填报
      starts_at: "2026-06-24 14:30"
      ends_at: "2026-06-24 20:30"
      scope: 军事、公安、司法、消防救援、机要密码、应急管理等相关院校意向类别；最多填报 45 个平行意向志愿，不设调剂选项
    - name: 首次填报本科提前批、本科批、高职专科提前批及对口本科等志愿
      starts_at: "2026-06-30 09:00"
      ends_at: "2026-07-04 17:00"
      scope: 普通类本科提前批 A/B、本科批、高职专科提前批，艺术类本科提前批 A/B，体育类本科提前批 A/B，对口本科；部分提前批 B 段和高职专科提前批相关院校具体院校专业组志愿自 2026-07-03 09:00 开始填报
    - name: 首次填报高职专科阶段志愿
      starts_at: "2026-07-29 09:00"
      ends_at: "2026-08-01 17:00"
      scope: 艺术类、体育类高职专科提前批，普通类高职专科批，对口高职专科批
  notes: 2026-06-24 第 1 号网上填报志愿公告为“意向类别志愿填报”，不等同于全部正式批次志愿；具体院校专业组志愿和后续填报需按第 1 号、第 2 号及后续公告执行。填报前必须读取高校招生章程、自治区规定、《2026年内蒙古自治区普通高校招生计划》或官方网上公布的招生计划；志愿系统或专栏发布的调整、投档比例、报考要求等视同已告知。

